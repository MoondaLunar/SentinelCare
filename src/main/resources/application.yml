spring:
  application:
    name: sentinel-care
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentinelcare}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
server:
  port: 8080

jwt:
  signing-key: ${JWT_SIGNING_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info
