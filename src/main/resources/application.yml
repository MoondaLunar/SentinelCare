spring:
  application:
    name: sentinel-care
  datasource:
    url: jdbc:postgresql://localhost:5432/sentinelcare
    username: sentinelcare
    password: sentinelcare
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    user:
      name: admin
      password: admin
      roles: ADMIN

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
