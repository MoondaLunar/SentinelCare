spring:
  datasource:
    # Plain H2 (no PostgreSQL mode): the PG dialect generates TINYINT for Envers
    # revtype / ordinal enums, which H2's PG mode rejects, and the migrations use
    # Postgres types (TIMESTAMPTZ) H2 cannot parse. Schema therefore comes from
    # the entities below. Postgres fidelity is verified against a real Postgres;
    # Testcontainers is the eventual upgrade if in-CI DDL fidelity is needed.
    url: jdbc:h2:mem:sentinelcare;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  signing-key: test-local-signing-key-32-bytes-2026
